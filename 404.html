<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting | Shree Raj &amp; Co.</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f8f7;
      color: #21343c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: #1f4659;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p>Redirecting to <a id="homeLink" href="./index.html">Shree Raj &amp; Co.</a></p>
  </main>
  <script>
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const isGitHubProjectPage = window.location.hostname.endsWith("github.io") && pathParts.length > 0;
    const basePath = isGitHubProjectPage ? `/${pathParts[0]}/` : "/";
    const target = `${window.location.origin}${basePath}${window.location.search}${window.location.hash}`;
    document.getElementById("homeLink").href = target;
    window.location.replace(target);
  </script>
</body>
</html>
